name: Site checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python scripts/check_site.py
      - run: python scripts/build_site.py
      - run: node --check js/site.js && node --check js/theme.js && node --check js/neo.js && node --check js/layout-viewer.js
      - name: Browser acceptance
        run: |
          python scripts/preview_site.py --port 5001 > /tmp/preview.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:5001/ > /dev/null; then break; fi
            sleep 1
          done
          npm run check:browser
          npm run check:media
